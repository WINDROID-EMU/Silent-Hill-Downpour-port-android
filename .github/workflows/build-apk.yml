name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Make Gradlew Executable
        run: chmod +x src/android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd src/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silent-Hill-Downpour-Android-APK
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-assets
          cp src/android/app/build/outputs/apk/debug/app-debug.apk release-assets/Silent-Hill-Downpour-Android-debug.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Silent-Hill-Downpour-Android-debug.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Silent Hill: Downpour Android Port {0}', github.ref_name) || 'Silent Hill: Downpour Android Port (Latest Build)' }}
          body: |
            ### 🎮 Silent Hill: Downpour - Android Port
            
            - **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Ref**: `${{ github.ref_name }}`
            
            #### 📦 Arquivos incluídos:
            - `Silent-Hill-Downpour-Android-debug.apk`: APK completo compilado para arquitetura `arm64-v8a` com suporte nativo a drivers de sistema e AdrenoTools / Mesa Turnip (compatível com Android 12 até Android 15).
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}